name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME" || {
            echo "Release tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          }
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node --version
      - run: npm install
      - run: npm run ci
      - name: Publish with npm Trusted Publishing (OIDC)
        run: npm publish --access public
